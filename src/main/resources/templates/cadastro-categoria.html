<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Categoria</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav class="navbar mb-0">
    <div class="container" style="padding-top:0;padding-bottom:0;">
        <a class="navbar-brand" href="/dashboard">FATEC - Catalogo</a>
        <div class="d-flex align-items-center gap-2">
            <a href="/categorias" class="btn btn-outline-light btn-sm">Categorias</a>
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="btn btn-outline-light btn-sm">Sair</button>
            </form>
        </div>
    </div>
</nav>

<div class="container">
    <div class="card mx-auto">
        <div class="card-header">
            <h2 th:text="${categoria.id == null ? 'Nova Categoria' : 'Editar Categoria'}"></h2>
        </div>
        <div class="card-body" style="padding: 24px !important;">
            <form th:action="${categoria.id == null} ? @{/categorias/novo} : @{/categorias/editar/{id}(id=${categoria.id})}"
                  th:object="${categoria}"
                  method="post"
                  novalidate>
                <div class="mb-4">
                    <label for="nome" class="form-label">Nome da categoria</label>
                    <input id="nome" type="text" th:field="*{nome}" class="form-control"
                           th:classappend="${#fields.hasErrors('nome')} ? 'is-invalid' : ''"
                           placeholder="Ex: Eletronicos">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></div>
                </div>
                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-success">Salvar categoria</button>
                    <a href="/categorias" class="btn btn-outline-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
