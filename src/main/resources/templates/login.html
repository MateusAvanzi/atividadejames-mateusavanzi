<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - FATEC Catalogo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="login-page">

<div class="login-card shadow-sm">
  <div class="login-header">
    <h1>FATEC Catalogo</h1>
    <p class="login-subtitle">Acesse sua conta para continuar</p>
  </div>
  <div class="login-body">
    <div th:if="${param.error}" class="alert-erro mb-3">
      Usuario ou senha invalidos.
    </div>

    <div th:if="${param.logout}" class="alert alert-success mb-3 py-2">
      Voce saiu com sucesso.
    </div>

    <form th:action="@{/login}" method="post">
      <div class="mb-3">
        <label class="form-label">Usuario</label>
        <input type="text"
               name="username"
               class="form-control"
               placeholder="Digite seu usuario"
               autofocus>
      </div>
      <div class="mb-4">
        <label class="form-label">Senha</label>
        <input type="password"
               name="password"
               class="form-control"
               placeholder="Digite sua senha">
      </div>
      <div class="d-grid">
        <button type="submit" class="btn btn-primary">Entrar</button>
      </div>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
