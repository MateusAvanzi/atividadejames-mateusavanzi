<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categorias</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav class="navbar mb-0">
    <div class="container" style="padding-top:0;padding-bottom:0;">
        <a class="navbar-brand" href="/dashboard">FATEC - Catalogo</a>
        <div class="d-flex align-items-center gap-2">
            <a href="/dashboard" class="btn btn-outline-light btn-sm">Dashboard</a>
            <a href="/produtos" class="btn btn-outline-light btn-sm">Produtos</a>
            <a sec:authorize="hasRole('ADMIN')" href="/usuarios" class="btn btn-outline-light btn-sm">Usuarios</a>
            <span class="text-white" th:text="'Ola, ' + ${#authentication.name}"></span>
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="btn btn-outline-light btn-sm">Sair</button>
            </form>
        </div>
    </div>
</nav>

<div class="container">
    <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
            <h2 class="mb-0">Categorias</h2>
            <div sec:authorize="hasRole('ADMIN')">
                <a href="/categorias/novo" class="btn btn-success btn-sm">+ Nova</a>
            </div>
        </div>
        <div class="card-body">
            <div th:if="${erro}" class="alert alert-danger">
                <span th:text="${erro}"></span>
            </div>
            <div class="table-responsive">
                <table class="table align-middle">
                    <thead>
                    <tr>
                        <th style="padding-left:24px;">ID</th>
                        <th>Nome</th>
                        <th sec:authorize="hasRole('ADMIN')">Acoes</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(categorias)}">
                        <td th:colspan="${#authorization.expression('hasRole(''ADMIN'')') ? 3 : 2}" style="border:none;">
                            <div class="empty-state">
                                <p>Nenhuma categoria cadastrada.</p>
                            </div>
                        </td>
                    </tr>
                    <tr th:each="c : ${categorias}">
                        <td style="padding-left:24px;" th:text="${c.id}"></td>
                        <td th:text="${c.nome}"></td>
                        <td sec:authorize="hasRole('ADMIN')">
                            <div class="action-group">
                                <a th:href="@{/categorias/editar/{id}(id=${c.id})}" class="btn btn-warning btn-sm">Editar</a>
                                <a th:href="@{/categorias/excluir/{id}(id=${c.id})}" class="btn btn-danger btn-sm">Excluir</a>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
